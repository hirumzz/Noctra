[workspace]
resolver = "2"
members = [
    "crates/noctra-types",
    "crates/noctra-platform",
    "crates/noctra-database",
    "crates/noctra-profiles",
    "crates/noctra-wm",
    "crates/noctra-privacy",
    "crates/noctra-network-monitor",
    "crates/noctra-downloads",
    "crates/noctra-torrent",
    "crates/noctra-devhub",
    "crates/noctra-ai",
    "crates/noctra-sync",
    "crates/noctra-chromium",
    "crates/noctra-core",
    "apps/noctra-desktop",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
authors = ["NOCTA Ecosystem Engineering <engineering@nocta.dev>"]
license = "MIT OR Apache-2.0"
description = "NOCTRA — Cross-Platform, Rust-First Desktop Web Browser. Beyond Browsing."

[workspace.dependencies]
tokio = { version = "1.40", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"
rusqlite = { version = "0.32", features = ["bundled"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream", "gzip"] }
axum = { version = "0.7", features = ["ws", "macros"] }
tower-http = { version = "0.5", features = ["cors", "fs"] }
uuid = { version = "1.10", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
thiserror = "1.0"
anyhow = "1.0"
sha1 = "0.10"
sha2 = "0.10"
hmac = "0.12"
chacha20poly1305 = "0.10"
rand = "0.8"
base64 = "0.22"
hex = "0.4"
url = { version = "2.5", features = ["serde"] }
urlencoding = "2.1"
regex = "1.10"
parking_lot = "0.12"
sysinfo = "0.31"
dirs = "5.0"
futures = "0.3"
async-trait = "0.1"
eframe = { version = "0.29", default-features = false, features = ["default_fonts", "glow"] }
egui = "0.29"
egui_extras = { version = "0.29", features = ["all_loaders"] }
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
tokio-tungstenite = "0.24"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true
panic = "abort"
